spring.application.name=delivery-workers
server.port=${SERVER_PORT:8091}
camunda.bpm.client.base-url=${CAMUNDA_BASE_URL:http://localhost:8080/engine-rest}
camunda.bpm.client.worker-id=${WORKER_ID:delivery-workers}
camunda.bpm.client.async-response-timeout=${CAMUNDA_ASYNC_RESPONSE_TIMEOUT:10000}
ppg.management.base-url=${PPG_MANAGEMENT_BASE_URL:http://localhost:8090}
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_SMTP_USERNAME:}
spring.mail.password=${MAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
mail.from=${MAIL_FROM:${spring.mail.username}}
mail.send-enabled=${MAIL_SEND_ENABLED:true}
