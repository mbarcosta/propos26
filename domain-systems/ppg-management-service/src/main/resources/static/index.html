<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PPG Management</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #17202a; }
      header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #d8dee6; }
      main { display: grid; gap: 16px; padding: 20px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
      section { background: #fff; border: 1px solid #d8dee6; border-radius: 6px; padding: 14px; }
      h1, h2 { margin: 0; }
      h2 { font-size: 18px; margin-bottom: 12px; }
      form { display: grid; gap: 8px; margin-bottom: 14px; }
      label { color: #52616f; font-size: 13px; }
      input, select, textarea, button { box-sizing: border-box; font: inherit; }
      input, select, textarea { width: 100%; border: 1px solid #bdc7d1; border-radius: 4px; padding: 8px; }
      textarea { min-height: 92px; font-family: Consolas, monospace; font-size: 12px; }
      button { border: 1px solid #9aa6b2; background: #fff; border-radius: 4px; padding: 7px 10px; cursor: pointer; }
      button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
      button.danger { border-color: #b42318; color: #b42318; }
      .actions, .form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .form-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
      .message { min-height: 18px; margin: 0 0 10px; color: #52616f; font-size: 13px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { border-bottom: 1px solid #e6ebf0; padding: 8px 6px; text-align: left; vertical-align: top; }
      th { color: #52616f; }
    </style>
  </head>
  <body>
    <header><h1>PPG Management</h1></header>
    <main>
      <section>
        <h2>Students</h2>
        <p id="studentsMessage" class="message"></p>
        <form id="studentForm">
          <input type="hidden" name="id">
          <div class="form-grid">
            <label>Registration <input name="registration" required></label>
            <label>Name <input name="name" required></label>
            <label>Email <input name="email" type="email" required></label>
            <label>Status <select name="status"><option>ACTIVE</option><option>INACTIVE</option><option>GRADUATED</option></select></label>
          </div>
          <div class="form-actions"><button class="primary" type="submit">Save Student</button><button type="button" data-reset="studentForm">New Student</button></div>
        </form>
        <table id="students"></table>
      </section>

      <section>
        <h2>Professors</h2>
        <p id="professorsMessage" class="message"></p>
        <form id="professorForm">
          <input type="hidden" name="id">
          <div class="form-grid">
            <label>Name <input name="name" required></label>
            <label>Email <input name="email" type="email" required></label>
            <label>Status <select name="status"><option>ACTIVE</option><option>INACTIVE</option><option>RETIRED</option></select></label>
          </div>
          <div class="form-actions"><button class="primary" type="submit">Save Professor</button><button type="button" data-reset="professorForm">New Professor</button></div>
        </form>
        <table id="professors"></table>
      </section>

      <section>
        <h2>Advisorships</h2>
        <table id="advisorships"></table>
      </section>

      <section>
        <h2>Defenses</h2>
        <p id="defensesMessage" class="message"></p>
        <form id="defenseForm">
          <input type="hidden" name="id">
          <div class="form-grid">
            <label>Student ID <input name="studentId" type="number" required></label>
            <label>Advisor ID <input name="advisorId" type="number" required></label>
            <label>Title <input name="title" required></label>
            <label>Date <input name="date" type="date"></label>
            <label>Location <input name="location"></label>
            <label>Status <select name="status"><option>HOMOLOGATED</option><option>DEFENDED</option><option>FINALIZED</option><option>CANCELLED</option></select></label>
          </div>
          <label>Committee Members JSON
            <textarea name="committeeMembers">[
  {"name":"", "email":"", "institution":"", "role":"MEMBER"}
]</textarea>
          </label>
          <div class="form-actions"><button class="primary" type="submit">Save Defense</button><button type="button" data-reset="defenseForm">New Defense</button></div>
        </form>
        <table id="defenses"></table>
      </section>

      <section>
        <h2>Dissertation Document</h2>
        <p id="documentsMessage" class="message"></p>
        <form id="documentForm">
          <div class="form-grid">
            <label>Defense ID <input name="defenseId" type="number" required></label>
            <label>File <input name="file" type="file" required></label>
          </div>
          <div class="form-actions"><button class="primary" type="submit">Upload or Replace</button><button type="button" id="loadDocument">Load Metadata</button></div>
        </form>
        <pre id="documentInfo"></pre>
      </section>

      <section>
        <h2>Programs</h2>
        <table id="programs"></table>
      </section>
    </main>
    <script>
      let students = [];
      let professors = [];
      let defenses = [];

      async function json(path, options) {
        const response = await fetch(path, options);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        if (response.status === 204) return null;
        return response.json();
      }

      function table(id, columns, rows, actions) {
        const element = document.getElementById(id);
        const actionHeader = actions ? '<th>Actions</th>' : '';
        element.innerHTML = '<thead><tr>' + columns.map((item) => `<th>${escapeHtml(item)}</th>`).join('') + actionHeader + '</tr></thead>' +
          '<tbody>' + rows.map((row) => {
            const cells = columns.map((column) => `<td>${escapeHtml(formatCell(row[column]))}</td>`).join('');
            const actionCells = actions ? `<td><div class="actions">${actions(row)}</div></td>` : '';
            return `<tr>${cells}${actionCells}</tr>`;
          }).join('') + '</tbody>';
      }

      function formatCell(value) {
        if (Array.isArray(value)) return value.map((item) => item.name || JSON.stringify(item)).join(', ');
        return value ?? '';
      }

      function formData(form) {
        return Object.fromEntries(new FormData(form).entries());
      }

      function numberOrNull(value) {
        return value === '' || value == null ? null : Number(value);
      }

      function fillForm(formId, data) {
        if (!data) return;
        const form = document.getElementById(formId);
        Object.entries(data).forEach(([key, value]) => {
          const field = form.elements[key];
          if (!field) return;
          field.value = key === 'committeeMembers' ? JSON.stringify(value || [], null, 2) : value ?? '';
        });
      }

      function resetForm(formId) {
        const form = document.getElementById(formId);
        form.reset();
        if (form.elements.id) form.elements.id.value = '';
      }

      function renderStudents() {
        table('students', ['id', 'registration', 'name', 'email', 'status'], students, (student) => `
          <button type="button" data-edit-student="${student.id}">Edit</button>
          <button class="danger" type="button" data-delete-student="${student.id}">Delete</button>`);
      }

      function renderProfessors() {
        table('professors', ['id', 'name', 'email', 'status'], professors, (professor) => `
          <button type="button" data-edit-professor="${professor.id}">Edit</button>
          <button class="danger" type="button" data-delete-professor="${professor.id}">Delete</button>`);
      }

      function renderDefenses() {
        table('defenses', ['id', 'studentId', 'advisorId', 'title', 'date', 'location', 'status', 'committeeMembers'], defenses, (defense) => `
          <button type="button" data-edit-defense="${defense.id}">Edit</button>
          <button type="button" data-cancel-defense="${defense.id}">Cancel</button>
          <button type="button" data-document-defense="${defense.id}">Document</button>`);
      }

      async function load() {
        const [loadedStudents, loadedProfessors, programs, advisorships, loadedDefenses] = await Promise.all([
          json('/api/students'), json('/api/professors'), json('/api/programs'), json('/api/advisorships'), json('/api/defenses')
        ]);
        students = loadedStudents;
        professors = loadedProfessors;
        defenses = loadedDefenses;
        renderStudents();
        renderProfessors();
        renderDefenses();
        table('programs', ['id', 'name', 'institution', 'campus', 'coordinatorName', 'coordinatorEmail'], programs);
        table('advisorships', ['id', 'studentId', 'advisorId', 'title', 'researchArea', 'startDate', 'status'], advisorships, (item) => `
          <button type="button" data-cancel-advisorship="${item.id}">Cancel</button>`);
      }

      async function saveStudent(event) {
        event.preventDefault();
        const payload = formData(event.currentTarget);
        const id = payload.id;
        delete payload.id;
        await json(id ? `/api/students/${id}` : '/api/students', {
          method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        resetForm('studentForm');
        document.getElementById('studentsMessage').textContent = 'Student saved.';
        await load();
      }

      async function saveProfessor(event) {
        event.preventDefault();
        const payload = formData(event.currentTarget);
        const id = payload.id;
        delete payload.id;
        await json(id ? `/api/professors/${id}` : '/api/professors', {
          method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        resetForm('professorForm');
        document.getElementById('professorsMessage').textContent = 'Professor saved.';
        await load();
      }

      async function saveDefense(event) {
        event.preventDefault();
        const payload = formData(event.currentTarget);
        const id = payload.id;
        delete payload.id;
        payload.studentId = numberOrNull(payload.studentId);
        payload.advisorId = numberOrNull(payload.advisorId);
        payload.date = payload.date || null;
        payload.committeeMembers = JSON.parse(payload.committeeMembers || '[]');
        await json(id ? `/api/defenses/${id}` : '/api/defenses', {
          method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        resetForm('defenseForm');
        document.getElementById('defensesMessage').textContent = 'Defense saved.';
        await load();
      }

      async function uploadDocument(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const defenseId = form.elements.defenseId.value;
        const body = new FormData(form);
        const metadata = await json(`/api/defenses/${defenseId}/dissertation`, { method: 'POST', body });
        document.getElementById('documentInfo').textContent = JSON.stringify(metadata, null, 2);
        document.getElementById('documentsMessage').textContent = 'Document uploaded.';
      }

      async function loadDocumentMetadata() {
        const defenseId = document.getElementById('documentForm').elements.defenseId.value;
        const metadata = await json(`/api/defenses/${defenseId}/dissertation`);
        const link = await json(`/api/defenses/${defenseId}/dissertation/download-link`, { method: 'POST' });
        document.getElementById('documentInfo').textContent = JSON.stringify({ metadata, link }, null, 2);
      }

      async function handleClick(event) {
        const target = event.target.dataset;
        if (target.reset) resetForm(target.reset);
        if (target.editStudent) fillForm('studentForm', students.find((item) => String(item.id) === target.editStudent));
        if (target.editProfessor) fillForm('professorForm', professors.find((item) => String(item.id) === target.editProfessor));
        if (target.editDefense) fillForm('defenseForm', defenses.find((item) => String(item.id) === target.editDefense));
        if (target.documentDefense) document.getElementById('documentForm').elements.defenseId.value = target.documentDefense;
        if (target.deleteStudent && confirm('Delete this student?')) await json(`/api/students/${target.deleteStudent}`, { method: 'DELETE' }).then(load);
        if (target.deleteProfessor && confirm('Delete this professor?')) await json(`/api/professors/${target.deleteProfessor}`, { method: 'DELETE' }).then(load);
        if (target.cancelAdvisorship && confirm('Cancel this advisorship?')) await json(`/api/advisorships/${target.cancelAdvisorship}/cancel`, { method: 'POST' }).then(load);
        if (target.cancelDefense && confirm('Cancel this defense?')) await json(`/api/defenses/${target.cancelDefense}/cancel`, { method: 'POST' }).then(load);
      }

      function escapeHtml(value) {
        return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      document.getElementById('studentForm').addEventListener('submit', saveStudent);
      document.getElementById('professorForm').addEventListener('submit', saveProfessor);
      document.getElementById('defenseForm').addEventListener('submit', saveDefense);
      document.getElementById('documentForm').addEventListener('submit', uploadDocument);
      document.getElementById('loadDocument').addEventListener('click', loadDocumentMetadata);
      document.addEventListener('click', handleClick);
      load();
    </script>
  </body>
</html>
