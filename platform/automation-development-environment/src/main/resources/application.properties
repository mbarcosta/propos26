spring.application.name=automation-development-environment
server.port=${SERVER_PORT:8070}
camunda.base-url=${CAMUNDA_BASE_URL:http://localhost:8080/engine-rest}
cir.base-url=${CIR_BASE_URL:http://localhost:8082}
gms.base-url=${GMS_BASE_URL:http://localhost:8081}
ade.capability-cache-file=${ADE_CAPABILITY_CACHE_FILE:data/discovered-capabilities.json}
ade.discovery.connect-timeout=${ADE_DISCOVERY_CONNECT_TIMEOUT:2s}
ade.discovery.read-timeout=${ADE_DISCOVERY_READ_TIMEOUT:5s}
ade.discovery.max-document-bytes=${ADE_DISCOVERY_MAX_DOCUMENT_BYTES:2097152}
ade.discovery.ttl=${ADE_DISCOVERY_TTL:5m}
ade.providers[0].id=PPG-ADM
ade.providers[0].name=PPG Management Service
ade.providers[0].contract-url=${PPG_MANAGEMENT_OPENAPI_URL:http://localhost:8090/v3/api-docs}
