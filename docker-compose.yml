services:
  camunda7:
    image: camunda/camunda-bpm-platform:run-latest
    container_name: propos26-camunda7
    expose:
      - "8080"

  ade:
    build: ./platform/automation-development-environment
    container_name: propos26-ade
    ports:
      - "${ADE_PORT:-8070}:8070"
    environment:
      SERVER_PORT: 8070
      CAMUNDA_BASE_URL: ${CAMUNDA_BASE_URL:-http://camunda7:8080/engine-rest}
      CIR_BASE_URL: ${CIR_BASE_URL:-http://cir:8082}
      GMS_BASE_URL: ${GMS_BASE_URL:-http://gms:8081}
      PPG_MANAGEMENT_OPENAPI_URL: ${PPG_MANAGEMENT_OPENAPI_URL:-http://ppg-management:8090/v3/api-docs}
      ADE_CAPABILITY_CACHE_FILE: /data/discovered-capabilities.json
    volumes:
      - ./platform/automation-development-environment/data:/data
    depends_on:
      - camunda7
      - cir
      - gms
      - ppg-management

  ppg-management:
    build: ./domain-systems/ppg-management-service
    container_name: propos26-ppg-management
    expose:
      - "8090"
    environment:
      SERVER_PORT: 8090
      PPG_DATA_FILE: /data/ppg-management.json
      PPG_DOCUMENTS_DIR: /documents
    volumes:
      - ./domain-systems/ppg-management-service/data:/data
      - ./domain-systems/ppg-management-service/data/documents:/documents

  gms:
    build: ./services/email-gateway-service
    container_name: propos26-gms
    ports:
      - "${GMS_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      GMS_MAIL_USERNAME: ${GMS_MAIL_USERNAME:-change-me}
      GMS_MAIL_PASSWORD: ${GMS_MAIL_PASSWORD:-change-me}
      GMS_MAIL_SSL_TRUST: ${GMS_MAIL_SSL_TRUST:-imap.gmail.com}
      APP_BINDINGS_FILE: ${GMS_BINDINGS_FILE:-/config/bindings.json}
    volumes:
      - ./services/email-gateway-service/data:/config

  cir:
    build: ./services/cir-service
    container_name: propos26-cir
    ports:
      - "${CIR_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      CAMUNDA_BASE_URL: ${CAMUNDA_BASE_URL:-http://camunda7:8080/engine-rest}
      GMS_BASE_URL: ${GMS_BASE_URL:-http://gms:8081}
      CIR_ROUTES_FILE: ${CIR_ROUTES_FILE:-/config/routes.json}
      CIR_EXTRACTIONS_FILE: ${CIR_EXTRACTIONS_FILE:-/config/extractions.json}
    volumes:
      - ./services/cir-service/data:/config
    depends_on:
      - camunda7
      - gms

  automation-workers:
    build: ./delivery-workers
    container_name: propos26-automation-workers
    ports:
      - "${WORKERS_PORT:-8091}:8091"
    environment:
      SERVER_PORT: 8091
      CAMUNDA_BASE_URL: ${CAMUNDA_BASE_URL:-http://camunda7:8080/engine-rest}
      WORKER_ID: propos26-automation-workers
      PPG_MANAGEMENT_BASE_URL: ${PPG_MANAGEMENT_BASE_URL:-http://host.docker.internal:8090}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-${GMS_MAIL_USERNAME:-change-me}}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-${GMS_MAIL_PASSWORD:-change-me}}
      MAIL_FROM: ${MAIL_FROM:-${GMS_MAIL_USERNAME:-change-me}}
      MAIL_SEND_ENABLED: ${MAIL_SEND_ENABLED:-true}
    depends_on:
      - camunda7
